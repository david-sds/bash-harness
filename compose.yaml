name: bash-harness

services:
  ollama:
    image: ollama/ollama:latest
    devices:
      - nvidia.com/gpu=all
    security_opt: ["label=disable"]
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ${OLLAMA_MODELS_DIR:?set OLLAMA_MODELS_DIR in .env (see .env.example)}:/root/.ollama:Z
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    # cpuset: "0-3"
    cpus: "3.0"
    mem_limit: 20g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    ports:
        - "11434:11434"
    networks: [ai, egress]

  harness:
    build: .
    image: bash-harness:local
    user: "1000:1000"
    userns_mode: keep-id
    init: true
    stdin_open: true
    tty: true
    environment:
      OLLAMA_HOST: http://ollama:11434
      HOME: /tmp
    volumes:
      - ./:/work:ro,z
      - ./sessions:/work/sessions:z
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    depends_on:
      ollama:
        condition: service_healthy
    networks: [ai]

networks:
  ai:
    internal: true
  egress: {}
